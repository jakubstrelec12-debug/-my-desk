name: MY DESK macOS application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native tests and app packaging
        run: bash scripts/build-app.sh
      - name: Verify arm64 executable
        run: |
          file 'dist/MY DESK.app/Contents/MacOS/MyDesk'
          lipo 'dist/MY DESK.app/Contents/MacOS/MyDesk' -verify_arch arm64
      - name: Launch installed app without access to build resources
        run: |
          mkdir -p dist/smoke
          OUTPUT="$PWD/dist/smoke"
          MOUNT="$RUNNER_TEMP/mydesk-dmg"
          INSTALLED="$RUNNER_TEMP/mydesk-installed"
          mkdir -p "$MOUNT" "$INSTALLED"
          hdiutil attach dist/MyDesk.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          ditto "$MOUNT/MY DESK.app" "$INSTALLED/MY DESK.app"
          hdiutil detach "$MOUNT"
          # Prevent the generated SwiftPM accessor from masking missing resources.
          mv "$PWD/.build" "$RUNNER_TEMP/mydesk-build-hidden"
          codesign --verify --strict --verbose=2 "$INSTALLED/MY DESK.app"
          cd "$RUNNER_TEMP"
          open -n -W "$INSTALLED/MY DESK.app" --args --smoke-test "$OUTPUT" &
          LAUNCH_PID=$!
          for attempt in {1..60}; do
            if test -s "$OUTPUT/smoke.json"; then break; fi
            sleep 1
          done
          test -s "$OUTPUT/dashboard.png"
          test -s "$OUTPUT/smoke.json"
          wait "$LAUNCH_PID"
      - name: Archive app preserving permissions
        run: ditto -c -k --keepParent 'dist/MY DESK.app' dist/MyDesk-app.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MY-DESK-macOS
          if-no-files-found: ignore
          path: |
            dist/MyDesk.dmg
            dist/MyDesk-app.zip
            dist/smoke/
